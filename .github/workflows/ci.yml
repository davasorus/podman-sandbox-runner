name: ci
on:
    push:
        branches: [live]
    pull_request:

permissions:
    contents: read

jobs:
    vulncheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go install golang.org/x/vuln/cmd/govulncheck@latest

            - name: govulncheck with allowlist
              run: |
                  govulncheck ./... > vuln.out 2>&1 || true
                  # extract flagged IDs, drop any that are allowlisted, fail on the rest
                  found=$(grep -oE 'GO-[0-9]{4}-[0-9]+' vuln.out | sort -u)
                  allowed=$(grep -oE '^GO-[0-9]{4}-[0-9]+' .govulncheck-allow | sort -u)
                  new=$(comm -23 <(echo "$found") <(echo "$allowed"))
                  if [ -n "$new" ]; then
                      echo "::error::Unallowlisted vulnerabilities found:"
                      echo "$new"
                      cat vuln.out
                      exit 1
                  fi
                  echo "Only allowlisted vulnerabilities present (or none)."
    link:
        needs: vulncheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: golangci/golangci-lint-action@v7
              with:
                  version: latest

    test:
        needs: link
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go vet ./...
            - run: go build ./...
            - run: go test -v -timeout 300s ./...
