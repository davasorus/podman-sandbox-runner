name: ci
on:
    push:
        branches: [live]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - run: go vet ./...
            - run: go build ./...
            - run: go test -v -timeout 300s ./...
